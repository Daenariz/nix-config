name: "Nix Flake & Format Check"

on:
  pull_request:
  push:
    branches:
      - master
      - client

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        system: [x86_64-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check flake metadata
        run: nix flake metadata

      - name: Format check (nixfmt)
        run: nix run nixpkgs#nixfmt -- --check .

      - name: Flake check (x86_64 only)
        run: nix flake check --impure
