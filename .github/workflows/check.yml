name: Check

on:
  pull_request:
  push:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Check nixfmt
        run: nixfmt --check $(find . -name '*.nix' | grep -v '.git' | sort | tr '\n' ' ')

  build-hosts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [naboshi, futro, kitsunebi]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Build ${{ matrix.host }}
        run: nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --out-link /tmp/result-${{ matrix.host }}
      - name: Cleanup
        run: rm -rf /tmp/result-${{ matrix.host }}
